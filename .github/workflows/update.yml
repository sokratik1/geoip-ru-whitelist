name: Update RU-WHITELIST

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate lists
        run: python3 parse.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ru-whitelist.txt not-ru.txt
          if git diff --cached --quiet; then
            echo "No changes, skipping commit."
          else
            WL=$(wc -l < ru-whitelist.txt)
            NR=$(wc -l < not-ru.txt)
            git commit -m "auto: update lists (RU: ${WL} CIDRs, not-RU: ${NR} CIDRs)"
            git push
          fi
