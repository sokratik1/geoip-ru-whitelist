name: Update RU-WHITELIST

on:
  schedule:
    # каждые 6 часов (исходный файл обновляется так же часто)
    - cron: "0 */6 * * *"
  workflow_dispatch: # ручной запуск из интерфейса GitHub

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # нужно для git push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Parse RU-WHITELIST
        run: python3 parse.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ru-whitelist.txt
          # Коммитим только если файл реально изменился
          if git diff --cached --quiet; then
            echo "No changes, skipping commit."
          else
            COUNT=$(wc -l < ru-whitelist.txt)
            git commit -m "auto: update RU-WHITELIST (${COUNT} CIDRs)"
            git push
          fi
